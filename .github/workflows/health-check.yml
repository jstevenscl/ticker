name: Data Health Check

# Independent watchdog. The build workflows can report "success" while publishing
# degraded data (that is exactly how the 2026-09 SiriusXM sports redesign went
# unnoticed for ~8 weeks), so this checks the PUBLISHED data and workflow
# liveness, and opens a GitHub issue (-> email) when something is wrong.
# One issue at a time: re-failures comment on it, recovery closes it.
#
# Debounce: a problem must show up on TWO consecutive checks (6h apart) before an
# issue/email is sent. Most one-off findings are transient -- e.g. STL picks up a
# lineup change hours before our daily channel-cache run does -- and clear by
# themselves. The first sighting is only logged; the next run finds the
# "Mark run unhealthy" step on the previous run (via the API) and escalates.

on:
  schedule:
    - cron: '41 */6 * * *'   # every 6h, off the :00 mark (GitHub drops :00 runs under load)
  workflow_dispatch:

jobs:
  health:
    # Only the public repo publishes to GitHub Pages; the private dev repo has nothing to check.
    if: github.repository == 'jstevenscl/ticker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run health check
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_REPORT: ${{ runner.temp }}/health-report.md
        run: python scripts/health_check.py

      # Marker only: the NEXT run looks for this step (conclusion=success) on this run.
      - name: Mark run unhealthy
        if: steps.check.outcome == 'failure'
        run: echo "health check found problems -- see the report above"

      - name: Decide whether to alert
        id: streak
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Escalate if a health-check issue is already open, or the previous
          # completed run was also unhealthy.
          OPEN=$(gh issue list --label health-check --state open --json number --jq 'length')
          PREV=$(gh run list --workflow health-check.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          PREV_BAD=0
          if [ -n "$PREV" ]; then
            PREV_BAD=$(gh api "repos/${{ github.repository }}/actions/runs/${PREV}/jobs"               --jq '[.jobs[].steps[] | select(.name=="Mark run unhealthy" and .conclusion=="success")] | length')
          fi
          if [ "${OPEN:-0}" -gt 0 ] || [ "${PREV_BAD:-0}" -gt 0 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
            echo "::notice::First unhealthy check -- holding the alert one cycle in case it is transient."
          fi

      - name: Open or update alert issue
        if: steps.check.outcome == 'failure' && steps.streak.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT="${{ runner.temp }}/health-report.md"
          [ -f "$REPORT" ] || echo "Health check crashed before writing a report -- see ${RUN_URL}" > "$REPORT"
          printf '\n[Workflow run](%s)\n' "$RUN_URL" >> "$REPORT"
          gh label create health-check --color d93f0b --description "Ticker data health alerts" 2>/dev/null || true
          EXISTING=$(gh issue list --label health-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$REPORT"
          else
            gh issue create --label health-check \
              --title "Ticker data health check failing -- $(date +%Y-%m-%d)" \
              --body-file "$REPORT"
          fi

      - name: Close alert issue on recovery
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for n in $(gh issue list --label health-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: all checks passing (${RUN_URL})"
          done

      - name: Fail the run if unhealthy
        if: steps.check.outcome == 'failure' && steps.streak.outputs.alert == 'true'
        run: exit 1
